[package]
name = "app"
version = "3.3.1"
description = "ScisoNomics - gestion financiera personal local-first"
authors = ["ScisoNomics"]
license = ""
repository = "https://github.com/iante/scisonomics"
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
keyring = "3"
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.1.1", features = ["rand_core", "zeroize"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }
sha2 = "=0.10.9"
zeroize = { version = "=1.8.2", features = ["derive"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "=2.10.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-sql = { version = "=2.3.1", features = ["sqlite"] }
# Already resolved by plugin-sql; direct mobile access enables atomic batches.
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
