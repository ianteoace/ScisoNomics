name: Security checks

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
  schedule:
    - cron: "17 7 * * 1"

permissions:
  contents: read

jobs:
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan working tree for secrets
        run: gitleaks dir --config .gitleaks.toml --redact=100 --exit-code=1 .
      - name: Scan complete available Git history for secrets
        if: ${{ !cancelled() }}
        run: gitleaks git --config .gitleaks.toml --redact=100 --exit-code=1 --log-opts="--all" .

  device-verification-postgres16:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
          POSTGRES_DB: scisonomics_device_verification_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d scisonomics_device_verification_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCISONOMICS_TEST_POSTGRES_URL: postgresql://postgres:postgres-test-only@127.0.0.1:5432/scisonomics_device_verification_test
      SCISONOMICS_DEVICE_TEST_DESTRUCTIVE_OK: YES_DROP_EPHEMERAL_DEVICE_TEST_SCHEMAS
      SCISONOMICS_DEVICE_TEST_EPHEMERAL_MARKER: github-actions-postgresql16-ephemeral
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modern_app/cloud_backend/requirements.txt
      - name: Install cloud test dependencies
        run: python -m pip install --disable-pip-version-check -r modern_app/cloud_backend/requirements.txt
      - name: Mark the dedicated PostgreSQL 16 database as ephemeral
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["SCISONOMICS_TEST_POSTGRES_URL"]) as conn:
              conn.execute(
                  "CREATE TABLE public.scisonomics_ephemeral_test_marker "
                  "(marker TEXT PRIMARY KEY, purpose TEXT NOT NULL)"
              )
              conn.execute(
                  "INSERT INTO public.scisonomics_ephemeral_test_marker (marker, purpose) VALUES (%s, %s)",
                  (
                      os.environ["SCISONOMICS_DEVICE_TEST_EPHEMERAL_MARKER"],
                      "device_verification_phase1",
                  ),
              )
          PY
      - name: Device Verification Python and PostgreSQL 16 tests
        run: >-
          python -m unittest
          modern_app.cloud_backend.test_device_verification_phase1
          modern_app.cloud_backend.test_device_verification_postgres
          -v

  rust-tauri:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modern_app/backend/requirements.txt
      - name: Install sidecar build dependencies
        working-directory: modern_app/backend
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check pyinstaller
      - name: Build ScisoNomics backend sidecar
        working-directory: modern_app/backend
        run: python -m PyInstaller .\scisonomics-backend.spec --noconfirm
      - name: Prepare Tauri external binary
        working-directory: modern_app/frontend
        run: npm run prepare:sidecar
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal --target x86_64-pc-windows-msvc
      - name: Install pinned cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        working-directory: modern_app/frontend/src-tauri
        # Vulnerabilities block CI; warnings remain visible and are reviewed periodically.
        run: cargo +1.88.0 audit --file Cargo.lock
      - name: Check Tauri Windows target
        working-directory: modern_app/frontend/src-tauri
        run: cargo +1.88.0 check --locked --target x86_64-pc-windows-msvc
      - name: Test Tauri
        working-directory: modern_app/frontend/src-tauri
        run: cargo +1.88.0 test --locked --target x86_64-pc-windows-msvc

  application-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            modern_app/backend/requirements.txt
            modern_app/cloud_backend/requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check -r modern_app/backend/requirements.txt -r modern_app/cloud_backend/requirements.txt
          python -m pip install pip-audit
      - name: Python security tests
        run: >-
          python -m unittest
          modern_app.cloud_backend.test_security
          modern_app.cloud_backend.test_device_sessions
          modern_app.cloud_backend.test_account_deletion
          modern_app.cloud_backend.test_google_play_billing
          -v
      - name: Smoke import local backend from clean checkout
        env:
          # Import-time logs stay in temporary storage; no server or real app data.
          LOCALAPPDATA: ${{ runner.temp }}/scisonomics-local-backend-tests
        run: python -c "import finance_app.services; import modern_app.backend.app.main"
      - name: Backup and restore validation tests
        env:
          LOCALAPPDATA: ${{ runner.temp }}/scisonomics-local-backend-tests
        run: python -m unittest finance_app.test_restore_validation -v
      - name: Audit Python dependencies
        run: |
          python -m pip_audit -r modern_app/backend/requirements.txt
          python -m pip_audit -r modern_app/cloud_backend/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: modern_app/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: modern_app/frontend
        run: npm ci
      - name: Frontend auth regression tests
        working-directory: modern_app/frontend
        run: npm run test:auth
      - name: Frontend billing regression tests
        working-directory: modern_app/frontend
        run: npm run test:billing
      - name: Frontend updater regression tests
        working-directory: modern_app/frontend
        run: npm run test:updater
      - name: Build frontend
        working-directory: modern_app/frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: modern_app/frontend
        run: npm audit --omit=dev --audit-level=high
